<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统监控</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 800px;
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .gauge-container {
            display: flex;
            justify-content: space-around;
            /* 平均分配空间 */
            align-items: center;
            margin-bottom: 20px;
        }

        .gauge {
            width: 200px;
            height: 100px;
            border-radius: 100px 100px 0 0;
            background-color: #eee;
            position: relative;
            overflow: hidden;
        }

        .gauge-arrow {
            width: 5px;
            height: 95px;
            background-color: #007bff;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform-origin: 50% 100%;
            transform: translateX(-50%) rotate(-90deg);
        }

        .gauge-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            font-weight: bold;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 20px;
        }

        th,
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>系统监控</h1>

        <div class="gauge-container">
            <div class="gauge">
                <div class="gauge-arrow" id="cpuGaugeArrow"></div>
                <div class="gauge-value" id="cpuGaugeValue">0%</div>
            </div>
            <div class="gauge">
                <div class="gauge-arrow" id="memoryGaugeArrow"></div>
                <div class="gauge-value" id="memoryGaugeValue">0%</div>
            </div>
        </div>

        <h2>CPU 使用率: <span id="cpu-percent"></span>%</h2>
        <h2>内存使用率: <span id="memory-used"></span></h2>

        <h2>硬盘信息</h2>
        <table id="disk-info">
            <thead>
                <tr>
                    <th>挂载点</th>
                    <th>总容量 (GB)</th>
                    <th>已用容量 (GB)</th>
                    <th>使用率</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <h2>网络接口</h2>
        <table id="network-interfaces">
            <thead>
                <tr>
                    <th>接口名称</th>
                    <th>下载速度 ({{.SpeedUnit}})</th>
                    <th>上传速度 ({{.SpeedUnit}})</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <h2>进程信息</h2>
        <table id="process-info">
            <thead>
                <tr>
                    <th>PID</th>
                    <th>进程名</th>
                    <th>CPU 使用率 (%)</th>
                    <th>内存使用 (MB)</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <script>
        $(document).ready(function () {
            setInterval(updateSystemInfo, 1000);
            setInterval(updateNetworkSpeed, 1000);
            setInterval(updateProcessInfo, 1000);
            setInterval(updateCPUGauge, 1000); // 每秒更新一次 CPU 仪表盘
            setInterval(updateMemoryGauge, 1000); // 每秒更新一次内存仪表盘
        });

        function updateSystemInfo() {
            $.getJSON("/system_info", function (data) {
                // 更新其他系统信息
                $("#cpu-percent").text(data.cpuPercent.toFixed(2));
                $("#memory-used").text(data.memoryUsed.toFixed(2) + "%");

                // 更新硬盘信息表格
                var diskInfoTbody = $("#disk-info tbody");
                diskInfoTbody.empty();
                $.each(data.diskInfos, function (index, disk) {
                    diskInfoTbody.append("<tr><td>" + disk.mountPoint + "</td><td>" + disk.total + "</td><td>" + disk.used + "</td><td>" + disk.usedPercent.toFixed(2) + "%</td></tr>");
                });
            });
        }

        // 更新 CPU 仪表盘
        function updateCPUGauge() {
            $.getJSON("/system_info", function (data) {
                const cpuUsage = data.CPUPercent;
                const cpuGaugeArrow = document.getElementById('cpuGaugeArrow');
                const cpuGaugeValue = document.getElementById('cpuGaugeValue');
                cpuGaugeArrow.style.transform = `translateX(-50%) rotate(${cpuUsage * 1.8 - 90}deg)`;
                cpuGaugeValue.textContent = `${cpuUsage.toFixed(1)}%`;
            });
        }

        // 更新内存仪表盘
        function updateMemoryGauge() {
            $.getJSON("/system_info", function (data) {
                const memoryUsage = data.MemoryUsed;
                const memoryGaugeArrow = document.getElementById('memoryGaugeArrow');
                const memoryGaugeValue = document.getElementById('memoryGaugeValue');
                memoryGaugeArrow.style.transform = `translateX(-50%) rotate(${memoryUsage * 1.8 - 90}deg)`;
                memoryGaugeValue.textContent = `${memoryUsage.toFixed(1)}%`;
            });
        }

        function updateNetworkSpeed() {
            // 获取速度单位
            var speedUnit = "{{.SpeedUnit}}";

            // 发送 AJAX 请求获取网络速度信息
            $.getJSON("/speed", function (data) {
                // 清空表格内容
                $("#network-interfaces tbody").empty();

                // 遍历网络接口数据
                for (var key in data) {
                    if (data.hasOwnProperty(key)) {
                        var speed = data[key];

                        // 格式化速度值
                        var downSpeed = formatSpeed(speed.BytesRecv, speedUnit);
                        var upSpeed = formatSpeed(speed.BytesSent, speedUnit);

                        // 添加新行到表格中
                        $("#network-interfaces tbody").append("<tr><td>" + speed.Name + "</td><td>" + downSpeed + "</td><td>" + upSpeed + "</td></tr>");
                    }
                }
            });
        }

        function updateProcessInfo() {
            $.getJSON("/processes", function (data) {
                // 更新进程信息表格
                var processInfoTbody = $("#process-info tbody");
                processInfoTbody.empty();
                $.each(data, function (index, process) {
                    processInfoTbody.append("<tr><td>" + process.pid + "</td><td>" + process.name + "</td><td>" + process.cpuPercent.toFixed(2) + "</td><td>" + process.memoryUsed.toFixed(2) + "</td></tr>");
                });
            });
        }

        // 格式化速度值
        function formatSpeed(bytes, unit) {
            // 如果字节数为 0，则直接返回 0
            if (bytes === 0) {
                return "0 " + unit;
            }

            var speed;
            if (unit === "mbps") {
                speed = bytes * 8 / 1000 / 1000; // Mbps
            } else {
                speed = bytes * 8 / 1000; // Kbps
            }
            return speed.toFixed(2) + " " + unit;
        }
    </script>
</body>

</html>
