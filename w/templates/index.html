<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统监控</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="/static/wo.js"></script>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 800px;
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .gauge-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 20px;
        }

        .gauge {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background-color: #eee;
            position: relative;
            overflow: hidden;
        }

        /* 删除 .gauge-arrow 样式 */

        .gauge-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            font-weight: bold;
            z-index: 3;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 20px;
        }

        th,
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>系统监控</h1>

        <div class="gauge-container">
            <div class="gauge">
                <div class="gauge-value" id="cpuGaugeValue">0%</div>
            </div>
            <div class="gauge">
                <div class="gauge-value" id="memoryGaugeValue">0%</div>
            </div>
        </div>
        <h2>硬盘信息</h2>
        <table id="disk-info">
            <thead>
                <tr>
                    <th>挂载点</th>
                    <th>总容量 (GB)</th>
                    <th>已用容量 (GB)</th>
                    <th>使用率</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <h2>网络接口</h2>
        <table id="network-interfaces">
            <thead>
                <tr>
                    <th>接口名称</th>
                    <th>下载速度 ({{.SpeedUnit}})</th>
                    <th>上传速度 ({{.SpeedUnit}})</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <h2>进程信息</h2>
        <table id="process-info">
            <thead>
                <tr>
                    <th>PID</th>
                    <th>进程名</th>
                    <th>CPU 使用率 (%)</th>
                    <th>内存使用 (MB)</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</body>

</html>
